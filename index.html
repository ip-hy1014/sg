<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>SG学習</title>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#ffffff"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <link rel="stylesheet" href="src/style.css?v=6"/>
</head>
<body>
  <div id="gate">
    <form id="gate-form" class="gate-card">
      <h1>SG学習</h1>
      <p>続けるにはパスワードが必要です。</p>
      <input id="gate-password" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="パスワード"/>
      <button type="submit">開く</button>
      <p id="gate-error" class="gate-error" hidden>パスワードが違います。</p>
    </form>
  </div>
  <div id="app"></div>
  <script src="src/vault.js?v=1"></script>
  <script src="src/gate.js?v=1"></script>
</body>
</html>
